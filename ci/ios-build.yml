name: iOS Automated Build & App Store Connect

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-ios:
    name: Build iOS App with Xcode 16 on macOS 14
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies for Asset Generation
        run: |
          python3 -m pip install --upgrade pip
          pip install Pillow

      - name: Install NPM Dependencies
        run: |
          npm ci || npm install

      - name: Run Unit Tests (export compliance / AdMob / safe area / www sync)
        run: |
          npm test

      - name: Generate Apple HIG Icons and Splashes
        run: |
          python3 scripts/generate-assets.py

      - name: Build Web Assets into www/
        run: |
          npm run build

      - name: Check Xcode Version on Runner
        run: |
          xcodebuild -version

      - name: Setup CocoaPods
        run: |
          pod --version

      - name: Initialize or Sync Capacitor iOS Project
        run: |
          if [ ! -d "ios" ]; then
            echo "[CI] Adding iOS platform..."
            npx cap add ios
          else
            echo "[CI] Syncing iOS platform..."
            npx cap sync ios
          fi
          node scripts/configure-ios.js
          node scripts/setup-ios-assets.js

      - name: Pin Google User Messaging Platform 2.x & Re-run pod install
        run: |
          cd ios/App
          pod --version
          # @capacitor-community/admob@6.2.0 pins Google-Mobile-Ads-SDK 11.3.0, whose Swift
          # sources use the pre-3.0 messaging symbols (UMPConsentStatus, UMPRequestParameters...).
          # CocoaPods can otherwise resolve GoogleUserMessagingPlatform 3.x, where those symbols
          # are renamed, and the AdMob plugin then fails to compile. Pin the messaging platform to 2.x.
          printf '%s\n' "import pathlib" "p = pathlib.Path('Podfile')" "s = p.read_text()" "if 'GoogleUserMessagingPlatform' not in s:" "    p.write_text(s.replace('  capacitor_pods\\n', \"  capacitor_pods\\n  pod 'GoogleUserMessagingPlatform', '~> 2.1'\\n\", 1))" > /tmp/pin_ump.py
          python3 /tmp/pin_ump.py
          echo "=== Podfile target block ==="
          grep -A4 "^target 'App' do" Podfile || true
          # `npx cap sync ios` already ran pod install and wrote a Podfile.lock that pins
          # GoogleUserMessagingPlatform 3.x; drop it so the pin above takes effect.
          rm -f Podfile.lock
          pod install
          echo "=== Resolved Google pod versions ==="
          grep -E "Google-Mobile-Ads-SDK|GoogleUserMessagingPlatform" Podfile.lock | head -10 || true

      - name: Verify Export Compliance in Generated Info.plist
        run: |
          grep -A1 '<key>ITSAppUsesNonExemptEncryption</key>' ios/App/App/Info.plist | grep '<false/>'
          echo "[CI] ITSAppUsesNonExemptEncryption = false (TestFlight auto-delivery OK)"

      - name: Verify AdMob Configuration in Generated Info.plist
        run: |
          # 本番アプリID（Google のサンプルID ca-app-pub-3940256099942544 ではない）
          grep -A1 '<key>GADApplicationIdentifier</key>' ios/App/App/Info.plist | grep 'ca-app-pub-5739782559889389~9293414856'
          # ATT（トラッキング許可）の説明文。これが無いと ATT ダイアログを出せず審査でも指摘される
          grep -q '<key>NSUserTrackingUsageDescription</key>' ios/App/App/Info.plist
          # SKAdNetwork（広告の効果測定）
          grep -q '<key>SKAdNetworkItems</key>' ios/App/App/Info.plist
          grep -q 'cstr6suwn9.skadnetwork' ios/App/App/Info.plist
          # ビルド成果物 www/ に admob.js が入っていること
          test -f www/admob.js
          grep -q 'ca-app-pub-5739782559889389/5354169841' www/config.js
          echo "[CI] AdMob app ID / ATT / SKAdNetwork / banner unit verified"

      - name: Verify iOS Project Pods / Workspace
        run: |
          cd ios/App
          ls -d App.xcworkspace
          grep -q 'CapacitorCommunityAdmob' Podfile.lock
          echo "[CI] CapacitorCommunityAdmob pod resolved"

      - name: Clean & Compile iOS App (Xcode Verification)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO

      - name: Upload iOS Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: date-15-ios-project
          path: |
            ios/App
            resources/
            www/
          retention-days: 7

      - name: Summary Report
        run: |
          echo "### iOS Automated Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: 15文字デート (com.oekaki.date15)" >> $GITHUB_STEP_SUMMARY
          echo "- **AdMob**: 下部常時バナー（app ca-app-pub-5739782559889389~9293414856 / banner ca-app-pub-5739782559889389/5354169841）" >> $GITHUB_STEP_SUMMARY
          echo "- **AdMob Mode**: config.js の USE_TEST_ADS でテスト広告 / 本番広告を切り替え（提出直前に false）" >> $GITHUB_STEP_SUMMARY
          echo "- **Xcode**: $(xcodebuild -version | tr '\n' ' ')" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS**: $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Clean compiled successfully without errors." >> $GITHUB_STEP_SUMMARY
